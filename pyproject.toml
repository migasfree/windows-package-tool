# https://setuptools.pypa.io/

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "windows-package-tool"
dynamic = ["version"]
authors = [
  {name = "Jose Antonio Chavarría", email = "jachavar@gmail.com"},
]
maintainers = [
  {name = "Jose Antonio Chavarría", email = "jachavar@gmail.com"},
]
license = { text = "GPL-3.0-or-later" }
description = "Windows Package Tool is a simplified Package Management System for Windows"
readme = "README.md"
keywords = ["pms", "systems management", "windows"]
requires-python = ">=3.6"
dependencies = [
    "packaging",
    "requests",
    "rich>=10.0.0,<13.0.0; python_version < '3.7'",
    "rich>=10.0.0; python_version >= '3.7'",
    "pywin32; sys_platform == 'win32'",
    "wmi; sys_platform == 'win32'",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License (GPL)",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python",
    "Topic :: Utilities",
]

[project.urls]
homepage = "https://github.com/migasfree/windows-package-tool"
repository = "https://github.com/migasfree/windows-package-tool"
"Bug Report" = "https://github.com/migasfree/windows-package-tool/issues"

[project.scripts]
wpt = "wpt.__main__:main"

[tool.setuptools.packages]
find = {}

[tool.setuptools.dynamic]
version = {attr = "wpt.__version__"}

# Include configuration files in package
[tool.setuptools.package-data]
"*" = ["*.conf", "conf.d/README"]

# Data files to install outside the package (to ProgramData on Windows)
# Note: For Windows, use a post-install script or installer (e.g., NSIS, Inno Setup)
# to copy conf/wpt.conf -> %PROGRAMDATA%\wpt\wpt.conf
# and create %PROGRAMDATA%\wpt\conf.d\ directory

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.1",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 120
target-version = "py37"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific rules
]
ignore = ["E501"]  # line too long (handled by formatter)

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.mypy]
python_version = "3.6"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
