# Windows Package Tool Configuration
# This is the main configuration file for wpt.
# Settings can be overridden by placing additional .conf files in the conf.d directory.
# Files in conf.d are loaded in alphabetical order.

[logging]
# Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
# Default: INFO
level = INFO

[ssl]
# SSL certificate verification
# Values:
#   true  - Verify SSL certificates (recommended for production)
#   false - Disable SSL verification (not recommended)
#   /path/to/ca-bundle.crt - Path to custom CA certificate bundle
# Default: true
verify = true

[scripts]
# Script execution timeout in seconds
# Default: 300 (5 minutes)
timeout = 300

[gpg]
# GPG signature verification mode
# Values:
#   required - Fail if signature is missing or invalid
#   optional - Warn but continue if signature fails (default)
#   disabled - Skip signature verification entirely
# Default: optional
verify = optional
